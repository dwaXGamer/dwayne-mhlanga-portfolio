<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38b6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38b6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38b6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" fill="url(#bg1)"/>
  <!-- faint grid -->
  <g stroke="#38b6ff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/><line x1="600" y1="0" x2="600" y2="320"/>
  </g>
  <!-- left: support ticket / wrench -->
  <g transform="translate(150,160)">
    <circle r="55" fill="#161b22" stroke="#2a3441" stroke-width="1.5"/>
    <path d="M-18,-12 a20,20 0 1 0 22,26 l16,16 a6,6 0 0 0 8,-8 l-16,-16 a20,20 0 0 0 -30,-18 l12,12 -6,10 -10,-2z" fill="#6b7684"/>
  </g>
  <!-- arrow -->
  <g transform="translate(400,160)" stroke="#38b6ff" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="-70" y1="0" x2="60" y2="0"/>
    <path d="M45,-12 L65,0 L45,12"/>
  </g>
  <!-- right: shield -->
  <g transform="translate(650,160)">
    <circle r="55" fill="#0e2233" stroke="#38b6ff" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M0,-30 L26,-18 L26,4 C26,22 14,32 0,38 C-14,32 -26,22 -26,4 L-26,-18 Z" fill="#38b6ff" fill-opacity="0.18" stroke="#38b6ff" stroke-width="2"/>
    <path d="M-10,2 L-3,10 L12,-8" stroke="#38b6ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="0" y="316" width="800" height="4" fill="url(#glow1)"/>
</svg>
