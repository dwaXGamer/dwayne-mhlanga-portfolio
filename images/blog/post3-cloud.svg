    <line x1="400" y1="200" x2="200" y2="260"/><circle cx="200" cy="260" r="6"/>
    <line x1="400" y1="200" x2="400" y2="270"/><circle cx="400" cy="270" r="6"/>
    <line x1="400" y1="200" x2="600" y2="260"/><circle cx="600" cy="260" r="6"/>
