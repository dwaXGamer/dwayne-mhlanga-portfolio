      <rect x="0" y="18" width="36" height="28" rx="5" fill="#38b6ff" fill-opacity="0.9"/>
      <path d="M6,18 v-8 a12,12 0 0 1 24,0 v8" fill="none" stroke="#38b6ff" stroke-width="4"/>
      <circle cx="18" cy="30" r="4" fill="#0d1117"/>
