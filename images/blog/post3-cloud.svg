<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="glow3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38b6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38b6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38b6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" fill="url(#bg3)"/>
  <g stroke="#38b6ff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/><line x1="0" y1="240" x2="800" y2="240"/>
  </g>
  <!-- cloud -->
  <g transform="translate(400,130)">
    <path d="M-90,20 a45,45 0 0 1 20,-86 a55,55 0 0 1 100,10 a40,40 0 0 1 5,76 Z"
